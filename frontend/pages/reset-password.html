<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password | DEVCRAFT Studio</title>
  <meta name="description" content="Set a new password for your DevCraft client account." />
  <link rel="icon" type="image/svg+xml" href="/assets/images/avatar-harshit.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body data-theme="futuristic-dev">

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="DEVCRAFT Home">
        <div class="brand-badge-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="brand-name">DEV<span>CRAFT</span></div>
      </a>

      <div class="nav-actions">
        <a href="/login" class="btn btn-ghost btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Reset Password Main Container -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-badge-icon" style="margin: 0 auto 14px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <h1>Create New Password</h1>
        <p>Set a strong replacement password for your account.</p>
      </div>

      <div id="reset-alert" class="auth-alert"></div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="input-label" for="new-password">New Password (min 8 chars, letters & numbers) *</label>
          <div class="input-password-wrap">
            <input type="password" id="new-password" class="form-control" placeholder="Enter new password" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePassVisibility('new-password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="input-label" for="confirm-new-password">Confirm New Password *</label>
          <div class="input-password-wrap">
            <input type="password" id="confirm-new-password" class="form-control" placeholder="Confirm new password" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePassVisibility('confirm-new-password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-block" style="padding: 14px; font-weight: 700; margin-top: 8px;">
          Update Password & Secure Account →
        </button>
      </form>

      <div class="auth-footer-links">
        Return to <a href="/login">Sign In</a>
      </div>
    </div>
  </main>

  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('reset-alert');
    const submitBtn = document.getElementById('reset-submit-btn');

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      showAlert('Password reset token is missing from your link. Please request a new reset link from the recovery page.');
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      if (!token) {
        return showAlert('Invalid or missing reset token. Please request a new link.');
      }

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-new-password').value;

      if (!newPassword || newPassword.length < 8) {
        return showAlert('Password must be at least 8 characters long.');
      }
      if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
        return showAlert('Password must contain both letters and numbers.');
      }
      if (newPassword !== confirmPassword) {
        return showAlert('Passwords do not match. Please re-enter your password confirmation.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating Password...';

      try {
        const res = await fetch('/api/users/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showAlert(data.message, 'success');
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          showAlert(data.message || 'Unable to reset password. Link may be expired.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password & Secure Account →';
        }
      } catch (err) {
        showAlert('Connection error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password & Secure Account →';
      }
    });
  </script>
</body>
</html>
