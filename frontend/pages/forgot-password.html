<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password Request | DEVCRAFT Studio</title>
  <meta name="description" content="Request a secure password reset token for your DevCraft client account." />
  <link rel="icon" type="image/svg+xml" href="/assets/images/avatar-harshit.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body data-theme="futuristic-dev">

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="DEVCRAFT Home">
        <div class="brand-badge-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="brand-name">DEV<span>CRAFT</span></div>
      </a>

      <div class="nav-actions">
        <a href="/login" class="btn btn-ghost btn-sm">Back to Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Forgot Password Main Container -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-badge-icon" style="margin: 0 auto 14px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1>Recover Account</h1>
        <p>Enter your account email to generate a secure password reset token.</p>
      </div>

      <div id="forgot-alert" class="auth-alert"></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="input-label" for="forgot-email">Registered Email Address</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@company.com" required autocomplete="email" />
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-block" style="padding: 14px; font-weight: 700; margin-top: 8px;">
          Request Password Reset Token →
        </button>
      </form>

      <div id="debug-token-box" style="display: none; margin-top: 20px; padding: 14px; background: rgba(0, 240, 255, 0.06); border: 1px dashed var(--accent); border-radius: 12px; font-size: 0.85rem;">
        <strong style="color: var(--accent);">Development Reset Token Ready:</strong>
        <p style="margin: 6px 0; color: var(--text-secondary); font-size: 0.82rem;">Click below to test the password reset flow directly:</p>
        <a id="debug-reset-link" href="#" class="btn btn-xs btn-primary" style="margin-top: 6px; display: inline-block;">Proceed to Reset Password →</a>
      </div>

      <div class="auth-footer-links">
        Remembered your password? <a href="/login">Sign in</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('forgot-alert');
    const submitBtn = document.getElementById('forgot-submit-btn');
    const debugBox = document.getElementById('debug-token-box');
    const debugLink = document.getElementById('debug-reset-link');

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      debugBox.style.display = 'none';

      const email = document.getElementById('forgot-email').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return showAlert('Please enter a valid email address.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Generating Token...';

      try {
        const res = await fetch('/api/users/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showAlert(data.message, 'success');
          
          if (!data.emailServiceConfigured) {
            const noteEl = document.createElement('div');
            noteEl.style.fontSize = '0.8rem';
            noteEl.style.color = 'var(--text-muted)';
            noteEl.style.marginTop = '8px';
            noteEl.textContent = 'Notice: External SMTP email dispatch is pending server environment configuration. Reset token has been safely registered on the server.';
            alertBox.appendChild(noteEl);
          }

          if (data.debugResetUrl) {
            debugBox.style.display = 'block';
            debugLink.href = data.debugResetUrl;
          }
        } else {
          showAlert(data.message || 'Unable to process request at this time.');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Request Password Reset Token →';
      }
    });
  </script>
</body>
</html>
