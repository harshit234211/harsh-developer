<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client & Partner Login | DEVCRAFT Studio</title>
  <meta name="description" content="Sign in to your DevCraft client account to review active development sprints, test staging links, and manage project specifications." />
  <link rel="icon" type="image/svg+xml" href="/assets/images/avatar-harshit.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body data-theme="futuristic-dev">

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="DEVCRAFT Home">
        <div class="brand-badge-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="brand-name">DEV<span>CRAFT</span></div>
      </a>

      <ul class="nav-links">
        <li><a href="/services" class="nav-link">Services</a></li>
        <li><a href="/projects" class="nav-link">Demos</a></li>
        <li><a href="/about" class="nav-link">About</a></li>
        <li><a href="/contact" class="nav-link">Contact</a></li>
        <li><a href="/register" class="nav-link">Register</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/register" class="btn btn-outline btn-sm">Register</a>
        <a href="/contact" class="btn btn-primary btn-sm btn-start-project-nav">Start Project</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-badge-icon" style="margin: 0 auto 14px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your DevCraft dashboard to manage projects and invoices.</p>
      </div>

      <div id="login-alert" class="auth-alert"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="input-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="input-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password" style="font-size: 0.8rem; color: var(--accent); text-decoration: none;">Forgot password?</a>
          </div>
          <div class="input-password-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePassVisibility('login-password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="auth-checkbox-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="login-remember" checked />
            <span>Remember this device for 30 days</span>
          </label>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="padding: 14px; font-weight: 700; margin-top: 8px;">
          Sign In to Workspace →
        </button>
      </form>

      <div class="auth-footer-links">
        Don't have an account yet? <a href="/register">Register here</a><br />
        <span style="font-size: 0.8rem; display: inline-block; margin-top: 8px;">Studio Administrator? <a href="/admin-login" style="color: var(--warning);">Admin Portal 🔒</a></span>
      </div>
    </div>
  </main>

  <script src="/js/devcraft-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DevCraftAuth.redirectIfAuthenticated('/dashboard');
    });

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit-btn');

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const rememberMe = document.getElementById('login-remember').checked;

      if (!email || !password) {
        return showAlert('Please enter both your email address and password.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        await DevCraftAuth.login(email, password, rememberMe);

        showAlert('Login successful! Loading your dashboard...', 'success');

        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') || '/dashboard';

        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 500);
      } catch (err) {
        showAlert(err.message || 'Invalid email or password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Workspace →';
      }
    });
  </script>
</body>
</html>
