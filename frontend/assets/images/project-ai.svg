<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
    <defs>
      <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a0f1d"/>
        <stop offset="50%" stop-color="#0b172e"/>
        <stop offset="100%" stop-color="#140f2d"/>
      </linearGradient>
      <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff"/>
        <stop offset="100%" stop-color="#7928ca"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="600" height="380" fill="url(#bg-ai)"/>
    <g opacity="0.15">
      <path d="M0,50 H600 M0,100 H600 M0,150 H600 M0,200 H600 M0,250 H600 M0,300 H600 M0,350 H600" stroke="#00f0ff" stroke-width="1"/>
      <path d="M50,0 V380 M100,0 V380 M150,0 V380 M200,0 V380 M250,0 V380 M300,0 V380 M350,0 V380 M400,0 V380 M450,0 V380 M500,0 V380 M550,0 V380" stroke="#00f0ff" stroke-width="1"/>
    </g>
    <!-- Neural Network Nodes -->
    <g filter="url(#glow)">
      <circle cx="300" cy="190" r="38" fill="none" stroke="url(#cyan-violet)" stroke-width="3"/>
      <circle cx="300" cy="190" r="12" fill="#00f0ff"/>
      <line x1="300" y1="190" x2="180" y2="130" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
      <line x1="300" y1="190" x2="180" y2="250" stroke="#7928ca" stroke-width="2" opacity="0.8"/>
      <line x1="300" y1="190" x2="420" y2="130" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
      <line x1="300" y1="190" x2="420" y2="250" stroke="#7928ca" stroke-width="2" opacity="0.8"/>
      <circle cx="180" cy="130" r="16" fill="#0b172e" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="180" cy="250" r="16" fill="#0b172e" stroke="#7928ca" stroke-width="2"/>
      <circle cx="420" cy="130" r="16" fill="#0b172e" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="420" cy="250" r="16" fill="#0b172e" stroke="#7928ca" stroke-width="2"/>
    </g>
    <text x="300" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">NEURAL CRAFT AI</text>
    <text x="300" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="1">SYNAPTIC CORE ENGINE</text>
  </svg>