<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
    <defs>
      <linearGradient id="bg-dash" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0b0e17"/>
        <stop offset="100%" stop-color="#141829"/>
      </linearGradient>
    </defs>
    <rect width="600" height="380" fill="url(#bg-dash)"/>
    <!-- Dashboard Window Frame -->
    <rect x="75" y="45" width="450" height="260" rx="10" fill="#0f1626" stroke="#1f2d48" stroke-width="2"/>
    <circle cx="100" cy="65" r="5" fill="#ef4444"/>
    <circle cx="115" cy="65" r="5" fill="#f59e0b"/>
    <circle cx="130" cy="65" r="5" fill="#10b981"/>
    <!-- Mini Charts -->
    <rect x="95" y="90" width="125" height="65" rx="6" fill="#141d30" stroke="#253554" stroke-width="1"/>
    <rect x="235" y="90" width="125" height="65" rx="6" fill="#141d30" stroke="#253554" stroke-width="1"/>
    <rect x="375" y="90" width="125" height="65" rx="6" fill="#141d30" stroke="#253554" stroke-width="1"/>
    <!-- Main Wave Chart -->
    <path d="M 95,240 Q 160,170 235,210 T 375,180 T 500,220" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <path d="M 95,260 Q 160,200 235,240 T 375,210 T 500,245" fill="none" stroke="#7928ca" stroke-width="2" opacity="0.7"/>
    <text x="300" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">PULSEFLOW DASHBOARD</text>
    <text x="300" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="1">TELEMETRY & OPERATIONS</text>
  </svg>