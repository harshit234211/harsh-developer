<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
    <defs>
      <linearGradient id="bg-ecom" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#080e1a"/>
        <stop offset="100%" stop-color="#07192a"/>
      </linearGradient>
      <linearGradient id="grad-ecom" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff"/>
        <stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <filter id="glow-ecom">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="600" height="380" fill="url(#bg-ecom)"/>
    <!-- Isometric 3D Cube -->
    <g transform="translate(300, 175)" filter="url(#glow-ecom)">
      <!-- Top face -->
      <polygon points="0,-70 65,-35 0,0 -65,-35" fill="#10b981" opacity="0.8"/>
      <!-- Right face -->
      <polygon points="0,0 65,-35 65,45 0,80" fill="#00c853" opacity="0.6"/>
      <!-- Left face -->
      <polygon points="-65,-35 0,0 0,80 -65,45" fill="#00f0ff" opacity="0.7"/>
      <!-- Floating Rings -->
      <ellipse cx="0" cy="15" rx="100" ry="35" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,6"/>
      <ellipse cx="0" cy="15" rx="125" ry="45" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </g>
    <text x="300" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">AETHERIA 3D STORE</text>
    <text x="300" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" text-anchor="middle" letter-spacing="1">NEXT-GEN WEBGL COMMERCE</text>
  </svg>